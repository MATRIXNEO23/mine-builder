name: Build Mine Builder Fabric
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth inference gate (mock, no credentials)
        run: node --test scripts/verify-plan-sharing.test.mjs
      - name: Compile mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: mine-builder-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Prepare downloadable JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar
      - name: Publish latest test build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=mine-builder-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar --clobber
          else
            gh release create "$TAG" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar --title "Mine Builder - ultima build di test" --notes "Build di test per Minecraft 1.20.1 Fabric. Il collegamento GPT non è ancora operativo." --prerelease --target "$GITHUB_SHA"
          fi
      - name: Save JAR inside repository downloads folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar
          TARGET=downloads/$FILE
          CONTENT=$(base64 -w 0 "$FILE")
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            jq -n --arg message "Update downloadable Mine Builder JAR" --arg content "$CONTENT" --arg sha "$SHA" '{message:$message,content:$content,sha:$sha}' > /tmp/jar-payload.json
          else
            jq -n --arg message "Add downloadable Mine Builder JAR" --arg content "$CONTENT" '{message:$message,content:$content}' > /tmp/jar-payload.json
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" --input /tmp/jar-payload.json

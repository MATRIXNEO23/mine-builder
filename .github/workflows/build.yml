name: Build Mine Builder Fabric
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'blueprint-builder/**'
      - '.github/workflows/blueprint-builder.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
concurrency:
  group: mine-builder-publish-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth inference gate (mock, no credentials)
        run: node --test scripts/verify-plan-sharing.test.mjs
      - name: Compile mod
        run: gradle --no-daemon build
      - name: Test GPT design contract (no network or credentials)
        run: |
          mkdir -p /tmp/minebuilder-contract-test
          javac -d /tmp/minebuilder-contract-test src/main/java/it/minebuilder/DesignContract.java src/test/java/it/minebuilder/DesignContractTest.java
          java -cp /tmp/minebuilder-contract-test it.minebuilder.DesignContractTest
      - uses: actions/upload-artifact@v4
        with:
          name: mine-builder-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Prepare downloadable JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar
      - name: Publish latest test build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=mine-builder-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar --clobber
          else
            gh release create "$TAG" Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar --title "Mine Builder - ultima build di test" --notes "Build di test per Minecraft 1.20.1 Fabric. Il collegamento GPT non è ancora operativo." --prerelease --target "$GITHUB_SHA"
          fi
      - name: Save JAR inside repository downloads folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=Mine-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar
          TARGET=downloads/$FILE
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET" --jq .sha 2>/dev/null || true)
          # Stream base64 via a file: large JARs exceed the OS argument length limit.
          base64 -w 0 "$FILE" > /tmp/mine-builder-content.b64
          if [ -n "$SHA" ]; then
            jq -n --arg message "Update downloadable Mine Builder JAR" --arg sha "$SHA" \
              --rawfile content /tmp/mine-builder-content.b64 \
              '{message:$message,content:$content,sha:$sha}' > /tmp/jar-payload.json
          else
            jq -n --arg message "Add downloadable Mine Builder JAR" \
              --rawfile content /tmp/mine-builder-content.b64 \
              '{message:$message,content:$content}' > /tmp/jar-payload.json
          fi
          # A newer commit can advance main while this workflow compiles.
          # Retry with a fresh blob SHA and current branch head.
          for attempt in 1 2 3 4 5; do
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET" --jq .sha 2>/dev/null || true)
            HEAD=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
            if [ -n "$SHA" ]; then
              jq -n --arg message "Update downloadable Mine Builder JAR" --arg sha "$SHA" \
                --arg branch main --rawfile content /tmp/mine-builder-content.b64 \
                '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/jar-payload.json
            else
              jq -n --arg message "Add downloadable Mine Builder JAR" \
                --arg branch main --rawfile content /tmp/mine-builder-content.b64 \
                '{message:$message,content:$content,branch:$branch}' > /tmp/jar-payload.json
            fi
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" --input /tmp/jar-payload.json; then
              exit 0
            fi
            echo "Publish conflict, retry $attempt; main was $HEAD"
            sleep 3
          done
          echo "Unable to publish JAR after retries" >&2
          exit 1

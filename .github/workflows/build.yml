name: Build Mine Builder Fabric
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: mine-builder-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error

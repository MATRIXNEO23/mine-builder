name: Publish permanent versioned JAR
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag matches mod version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag and mod_version mismatch"; exit 1; }
      - name: Run tests
        run: node --test scripts/verify-plan-sharing.test.mjs
      - name: Compile Fabric JAR
        run: gradle --no-daemon build
      - name: Prepare versioned release asset
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p release
          jar="build/libs/mine-builder-$version.jar"
          test -s "$jar" || { echo "Missing production JAR: $jar"; exit 1; }
          cp "$jar" "release/Mine-Builder-v$version-Minecraft-1.20.1-Fabric.jar"
          (cd release && sha256sum *.jar > SHA256SUMS.txt)
      - name: Publish GitHub Release (not expiring Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "Mine Builder $GITHUB_REF_NAME" --notes "Versioned Fabric 1.20.1 build. Install the JAR in Prism Launcher. Check project README for functional status." --verify-tag

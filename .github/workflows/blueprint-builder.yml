name: Build Blueprint Builder
on:
  push:
    branches: [main]
    paths:
      - 'blueprint-builder/**'
      - '.github/workflows/blueprint-builder.yml'
  workflow_dispatch:
concurrency:
  group: blueprint-builder-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build standalone mod and verify import contract
        working-directory: blueprint-builder
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-builder-fabric-1.20.1
          path: blueprint-builder/build/libs/*.jar
          if-no-files-found: error
      - name: Publish separate mod and save to downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=Blueprint-Builder-v0.1.0-Minecraft-1.20.1-Fabric.jar
          cp blueprint-builder/build/libs/blueprint-builder-0.1.0.jar "$FILE"
          sha256sum "$FILE" > Blueprint-Builder-SHA256SUMS.txt
          if gh release view blueprint-builder-latest >/dev/null 2>&1; then
            gh release upload blueprint-builder-latest "$FILE" Blueprint-Builder-SHA256SUMS.txt --clobber
          else
            gh release create blueprint-builder-latest "$FILE" Blueprint-Builder-SHA256SUMS.txt --title 'Blueprint Builder — importa e costruisci' --notes 'Mod distinta da Mine Builder. Minecraft 1.20.1 Fabric Java 17. Import JSON/JSON.GZ, console, protezione area occupata e ripresa. Test runtime in mondo nuovo necessari.' --prerelease --target "$GITHUB_SHA"
          fi
          for FILE in "$FILE" Blueprint-Builder-SHA256SUMS.txt; do
            base64 -w 0 "$FILE" > /tmp/blueprint-content.b64
            TARGET="downloads/$FILE"
            for attempt in 1 2 3 4 5; do
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET?ref=main" --jq .sha 2>/dev/null || true)
              jq -n --arg message 'Update standalone Blueprint Builder download' --arg branch main --arg sha "$SHA" --rawfile content /tmp/blueprint-content.b64 '{message:$message,branch:$branch,content:$content} + (if $sha == "" then {} else {sha:$sha} end)' > /tmp/blueprint-payload.json
              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" --input /tmp/blueprint-payload.json; then break; fi
              test "$attempt" -lt 5 || exit 1
              sleep 2
            done
          done
